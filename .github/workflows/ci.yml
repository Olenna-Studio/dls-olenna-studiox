name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate & Compile Tokens
        run: pnpm build:tokens

      - name: Run Unit & Accessibility Tests
        run: pnpm test

      - name: Build All Monorepo Packages
        run: pnpm build

      - name: Build Documentation Website (VitePress)
        run: pnpm build:docs

      - name: Build Storybook Catalog
        run: pnpm build:storybook

      - name: Build Consumer Example Applications
        run: pnpm build:examples
